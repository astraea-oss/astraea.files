# Ember lock screen — aligned with the Iz Ember SDDM theme.

$rose = rgb(fff1f7)
$muted = rgb(e5a7b6)
$hot = rgb(d81f53)
$wine = rgba(14030766)
$ui = JetBrains Mono
$display = Iceland

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/tera/Pictures/1298385.jpg
    blur_passes = 1
    contrast = 1
    vibrancy = 0.08
    vibrancy_darkness = 0.12
}

shape {
    monitor =
    size = 100%, 100%
    color = $wine
    position = 0, 0
    halign = center
    valign = center
}

# Clock block — bottom-left, Iceland display face, and ember underline.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $rose
    font_size = 112
    font_family = $display
    position = 88, 128
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  %B %-d"
    color = $muted
    font_size = 25
    font_family = $display
    position = 90, 76
    halign = left
    valign = bottom
}

shape {
    monitor =
    size = 180, 2
    color = $hot
    position = 90, 58
    halign = left
    valign = bottom
}

# EDIT ME: This generic centered prompt avoids tying the lock screen to
# particular monitor names or resolutions. Adjust alignment and position for
# your display layout if you want a custom placement.
label {
    monitor =
    text = $DESC
    color = $rose
    font_size = 64
    font_family = $display
    position = 0, 54
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 310, 36
    outline_thickness = 0
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgba(00000000)
    inner_color = rgba(09010514)
    font_color = $rose
    check_color = $hot
    fail_color = rgb(ff6b8f)
    fade_on_empty = false
    rounding = 0
    font_family = $ui
    placeholder_text =
    hide_input = false
    position = -328, 2
    halign = right
    valign = center
}

shape {
    monitor =
    size = 310, 1
    color = rgba(d81f53a6)
    position = -328, -18
    halign = right
    valign = center
}
